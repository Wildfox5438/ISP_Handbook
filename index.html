<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Gamepass Check</title>
  <style>
    body {
      background-color: #0e0e0e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
    }
    input, button {
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin: 5px;
    }
    button {
      background-color: #0078ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bcc;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Check Your Gamepass Ownership</h1>
  <input type="text" id="username" placeholder="Enter your Roblox username">
  <button onclick="checkGamepass()">Check</button>
  <div id="result"></div>

  <script>
    async function checkGamepass() {
      const username = document.getElementById('username').value.trim();
      const gamepassId = '107870591'; // You can change or duplicate this for multiple gamepasses
      const resultDiv = document.getElementById('result');
      
      if (!username) {
        resultDiv.innerHTML = '⚠️ Please enter a username.';
        return;
      }

      resultDiv.innerHTML = '⏳ Checking...';

      try {
        const res = await fetch(`https://roblox-proxy-px3p.onrender.com/ownsGamepass?username=${username}&gamepassId=${gamepassId}`);
        const data = await res.json();

        if (data.ownsGamepass) {
          resultDiv.innerHTML = `✅ ${username} owns this gamepass!`;
        } else {
          resultDiv.innerHTML = `❌ ${username} does not own this gamepass.`;
        }
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = '⚠️ Error connecting to server.';
      }
    }
  </script>
</body>
</html>
