<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamepass Ownership Checker</title>
  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      width: 250px;
      text-align: center;
      margin-top: 20px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
      margin-left: 10px;
    }
    button:hover {
      background: #1e40af;
    }
    #result {
      margin-top: 30px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <h1>Roblox Gamepass Ownership Checker</h1>
  <p>Enter your Roblox username below to check if you own the Gamepass "<b>it's breakfast o'clock</b>"</p>
  
  <input type="text" id="username" placeholder="Enter Roblox username" />
  <button onclick="checkOwnership()">Check Ownership</button>
  
  <div id="result"></div>
  
  <script>
    const gamepassId = "107870591"; // Your Gamepass ID

    async function checkOwnership() {
      const username = document.getElementById("username").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = "Checking...";

      if (!username) {
        resultDiv.textContent = "⚠️ Please enter a username.";
        return;
      }

      try {
        // Step 1: Get User ID from Username
        const userResponse = await fetch(`https://users.roblox.com/v1/usernames/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usernames: [username] })
        });
        const userData = await userResponse.json();

        if (!userData.data || userData.data.length === 0) {
          resultDiv.textContent = "❌ Username not found.";
          return;
        }

        const userId = userData.data[0].id;

        // Step 2: Check Gamepass Ownership
        const ownershipUrl = `https://inventory.roblox.com/v1/users/${userId}/items/GamePass/${gamepassId}`;
        const ownershipResponse = await fetch(ownershipUrl);
        
        if (ownershipResponse.ok) {
          const data = await ownershipResponse.json();
          if (data && data.data && data.data.length > 0) {
            resultDiv.textContent = "✅ You own this Gamepass!";
          } else {
            resultDiv.textContent = "❌ You do not own this Gamepass.";
          }
        } else if (ownershipResponse.status === 404) {
          resultDiv.textContent = "❌ You do not own this Gamepass.";
        } else {
          resultDiv.textContent = "⚠️ Unable to check ownership. Try again later.";
        }

      } catch (err) {
        console.error(err);
        resultDiv.textContent = "⚠️ Error connecting to Roblox API.";
      }
    }
  </script>

  <footer style="margin-top:40px; opacity:0.7; font-size:14px;">
    © 2025 Wildfox5438. All rights reserved. This site is for demonstration only.
  </footer>
</body>
</html>
