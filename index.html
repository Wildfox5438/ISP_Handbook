<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox Gamepass Check</title>
  <style>
    body {
      background-color: #0e0e0e;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 80px;
    }
    input, button, select {
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      margin: 5px;
    }
    button {
      background-color: #0078ff;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover {
      background-color: #005bcc;
    }
    #result {
      margin-top: 20px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>🎮 Roblox Gamepass Ownership Checker</h1>
  <p>Enter your Roblox username to see if you own the selected gamepass.</p>

  <input type="text" id="username" placeholder="Enter your Roblox username">

  <!-- Optional: multiple gamepass selection -->
  <select id="gamepassId">
    <option value="107870591">🍳 It's Breakfast O'clock</option>
    <!-- You can add more gamepasses here -->
    <!-- <option value="123456789">🚗 Super Car Pack</option> -->
    <!-- <option value="987654321">🏠 Premium House Access</option> -->
  </select>

  <button onclick="checkGamepass()">Check</button>

  <div id="result"></div>

  <script>
    async function checkGamepass() {
      const username = document.getElementById('username').value.trim();
      const gamepassId = document.getElementById('gamepassId').value;
      const resultDiv = document.getElementById('result');
      
      if (!username) {
        resultDiv.innerHTML = '⚠️ Please enter a username.';
        return;
      }

      resultDiv.innerHTML = '⏳ Checking...';

      try {
        const res = await fetch(`https://roblox-proxy-px3p.onrender.com/api/ownership?username=${username}&gamepassId=${gamepassId}`);
        const data = await res.json();

        if (data.error) {
          resultDiv.innerHTML = `⚠️ ${data.error}`;
        } else if (data.owned) {
          resultDiv.innerHTML = `✅ ${username} owns this gamepass!`;
        } else {
          resultDiv.innerHTML = `❌ ${username} does not own this gamepass.`;
        }
      } catch (err) {
        console.error(err);
        resultDiv.innerHTML = '⚠️ Error connecting to server.';
      }
    }
  </script>
</body>
</html>
